<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FineControl App</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="header">
      <h1>FineControl</h1>
    </header>

    <main class="main">
      <div>
        <h2>Download FineControl today</h2>
      </div>

      <div class="photos">
        <img src="Images/Welcome.png" alt="Welcome screen" />
        <img src="Images/Transactions.png" alt="Transactions screen" />
        <img src="Images/New.png" alt="New Transaction screen" />
        <img src="Images/Budget.png" alt="Budget screen" />
        <img src="Images/Profile.png" alt="Profile screen" />
      </div>

      <div class="content">
        <p>Take control of your finances with ease...</p>
        <button id="downloadBtn">Download Now</button>

        <p>Check our privacy policy:</p>
        <button id="btnPrivacyPolicy">Privacy Policy</button>
      </div>
    </main>

    <footer class="footer">
      <p>© 2025 FineControl App. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
